
include:
  - local: /.gitlab/ci/builds.yml
  - local: /.gitlab/ci/checks.yml
  - local: /.gitlab/ci/tests.yml
  - local: /.gitlab/ci/docs.yml
  - local: /.gitlab/ci/packaging.yml
  - local: /.gitlab/ci/releases.yml
  - component: gitlab.com/melodium/gitlab-ci/melodium@v0.10.4
    rules:
      - if: '$CADENCE == "true"'
    inputs:
      job_name: cadence:trigger
      stage: build
      version: 0.11.0
      command: run --api-report .cadence-ci/Compo.toml main --gitlab_project_id "$CI_PROJECT_ID" --gitlab_sha "$CI_COMMIT_SHA" --gitlab_ref "$CI_COMMIT_REF_NAME" --gitlab_pipeline_id "$CI_PIPELINE_ID" --repository_url "$CI_REPOSITORY_URL"
      melodium_api_token: $CADENCE_API_TOKEN

variables:
  MELODIUM_SECRET_GITLAB_TOKEN: $API_TOKEN
  PACKAGES: audio cicd crypto distrib encoding fs http javascript json ml net process record regex sql std vault work

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

stages:
  - build
  - test
  - doc
  - packaging
  - release
