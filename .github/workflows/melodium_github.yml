name: Mélodium CI on GitHub

on: workflow_dispatch

jobs:
  melodium_github:
    runs-on: ubuntu-latest
    permissions: write-all
    container:
      image: registry.gitlab.com/melodium/melodium:alpine-0.10.4
      credentials:
        username: user
        password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      env:
        MELODIUM_HOME: /melodium_home
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Mélodium CI
        env:
          MELODIUM_SERVICE_KEY: ${{ secrets.MELODIUM_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mkdir -p ./results/logs && melodium run --logs ./results/logs/full.log .melodium/Compo.toml main --on_github=true --test=true --out_directory ./results --key env:MELODIUM_SERVICE_KEY --repository_url "${{ github.repositoryUrl }}" --ci_token env:GITHUB_TOKEN --project "${{ github.repository }}" --ref "${{ github.ref_name }}" --sha "${{ github.sha }}"
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
      