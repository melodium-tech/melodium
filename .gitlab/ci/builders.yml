

# Builders follows syntax [host os]/[target triple]

.host:debian:
  image: rust:1.91-bullseye

.host:windows:
  tags:
    - saas-windows-medium-amd64

.cache:cargo:
  variables:
    CARGO_INCREMENTAL: 0
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    - key: cargo-$CI_JOB_NAME_SLUG
      paths:
      - .cargo/
      policy: pull-push

.cache:cargo-alsa-musl:
  variables:
    CARGO_INCREMENTAL: 0
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    - key: cargo-$CI_JOB_NAME_SLUG
      paths:
      - .cargo/
      policy: pull-push
    - key: alsa-musl-$CI_JOB_NAME_SLUG
      paths:
      - .alsa-musl/
      policy: pull-push

.cache:cargo-osxcross:
  variables:
    CARGO_INCREMENTAL: 0
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    - key: cargo-osxcross-$CI_JOB_NAME_SLUG
      paths:
      - .cargo/
      - osxcross/
      policy: pull-push

.cache:cargo-xwin:
  variables:
    CARGO_INCREMENTAL: 0
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    - key: cargo-xwin-$CI_JOB_NAME
      paths:
      - .cargo/
      - .xwin/
      policy: pull-push

.builder:linux:x86_64-unknown-linux-gnu:
  extends:
    - .host:debian
    - .cache:cargo
  before_script:
    - apt-get update
    - apt-get install -y libasound2-dev
    - export CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu
    - rustc --version
    - cargo --version 

.builder:linux:x86_64-unknown-linux-musl:
  extends:
    - .host:debian
    - .cache:cargo-alsa-musl
  before_script:
    - apt-get update
    - apt-get install -y musl-tools make linux-libc-dev
    - |
      if [ ! -f "$CI_PROJECT_DIR/.alsa-musl/lib/libasound.a" ]; then
        apt-get install -y wget
        wget -q https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.12.tar.bz2
        tar xf alsa-lib-1.2.12.tar.bz2
        cd alsa-lib-1.2.12
        ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/asm
        ln -sf /usr/include/x86_64-linux-gnu/linux /usr/include/linux
        CC=musl-gcc ./configure --host=x86_64-linux-musl --prefix=$CI_PROJECT_DIR/.alsa-musl --enable-static --disable-shared --disable-python --disable-alisp --without-debug
        make -j$(nproc)
        make install
        cd ..
        rm -rf alsa-lib-1.2.12 alsa-lib-1.2.12.tar.bz2
      fi
    - rustup target add x86_64-unknown-linux-musl
    - export CARGO_BUILD_TARGET=x86_64-unknown-linux-musl
    - export PKG_CONFIG_PATH=$CI_PROJECT_DIR/.alsa-musl/lib/pkgconfig
    - export PKG_CONFIG_ALLOW_CROSS=1
    - rustc --version
    - cargo --version

.builder:linux:i686-unknown-linux-gnu:
  extends:
    - .host:debian
    - .cache:cargo
  before_script:
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y gcc-multilib libasound2-dev:i386
    - rustup target add i686-unknown-linux-gnu
    - export PATH="$CARGO_HOME/bin:$PATH"
    - export PKG_CONFIG=/usr/bin/i686-linux-gnu-pkg-config
    - export CARGO_BUILD_TARGET=i686-unknown-linux-gnu
    - rustc --version
    - cargo --version 

.builder:linux:i686-unknown-linux-musl:
  extends:
    - .host:debian
    - .cache:cargo-alsa-musl
  before_script:
   - dpkg --add-architecture i386
   - apt-get update
   - apt-get install -y gcc-multilib make wget
   - wget https://repo.melodium.tech/tooling/musl/i686-linux-musl-cross.tar.gz
   - tar --extract --gzip --file i686-linux-musl-cross.tar.gz --directory /usr/local
   - ln -s /usr/local/i686-linux-musl-cross/i686-linux-musl/lib/libgcc_s.so.1 /usr/local/i686-linux-musl-cross/i686-linux-musl/lib/libgcc.so
   - |
     if [ ! -f "$CI_PROJECT_DIR/.alsa-musl/lib/libasound.a" ]; then
       wget -q https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.12.tar.bz2
       tar xf alsa-lib-1.2.12.tar.bz2
       cd alsa-lib-1.2.12
       CC=/usr/local/i686-linux-musl-cross/bin/i686-linux-musl-gcc ./configure --host=i686-linux-musl --prefix=$CI_PROJECT_DIR/.alsa-musl --enable-static --disable-shared --disable-python --disable-alisp --without-debug
       make -j$(nproc)
       make install
       cd ..
       rm -rf alsa-lib-1.2.12 alsa-lib-1.2.12.tar.bz2
     fi
   - rustup target add i686-unknown-linux-musl
   - export PATH="$CARGO_HOME/bin:$PATH"
   - export CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/i686-linux-musl-cross/bin/i686-linux-musl-ld
   - export CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_AR=/usr/local/i686-linux-musl-cross/bin/i686-linux-musl-ar
   - export TARGET_CC=/usr/local/i686-linux-musl-cross/bin/i686-linux-musl-gcc
   - export TARGET_AR=/usr/local/i686-linux-musl-cross/bin/i686-linux-musl-gcc-ar
   - export CARGO_BUILD_TARGET=i686-unknown-linux-musl
   - export PKG_CONFIG_PATH=$CI_PROJECT_DIR/.alsa-musl/lib/pkgconfig
   - export PKG_CONFIG_ALLOW_CROSS=1
   - rustc --version
   - cargo --version

