[package]
name = "audio-mel"
version = "0.11.0"
authors = ["Quentin VIGNAUD <quentin.vignaud@melodium.tech>"]
rust-version = "1.94"
edition = "2021"
license = "EUPL-1.2"
homepage = "https://melodium.tech"
repository = "https://gitlab.com/melodium/melodium"
readme = "README.md"
description = "Mélodium audio processing library"
keywords = ["dataflow","parallelization","scalability","async","signal"]
categories = ["compilers", "science", "concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib"]
name = "audio_mel"

[dependencies]
async-channel = "2"
futures = "0.3.28"
melodium-core = { path = "../../melodium-core", version = "0.11.0" }
melodium-macro = { path = "../../melodium-macro", version = "0.11.0" }
std-mel = { path = "../std-mel", version = "0.11.0" }
serde = "1.0.185"
serde_json = "1.0.105"

[dependencies.blocking]
version = "1.6"
optional = true

[dependencies.symphonia]
version = "0.5.4"
features = ["all"]
optional = true

[dependencies.hound]
version = "3.5"
optional = true

[dependencies.flacenc]
version = "0.5"
default-features = false
features = ["par"]
optional = true

[features]
mock = []
plugin = []
real = ["blocking", "symphonia", "hound", "flacenc"]
"docs.rs" = ["mock", "std-mel/docs.rs"]

[package.metadata.docs.rs]
features = ["docs.rs"]
rustdoc-args = ["--cfg", "docsrs"]

