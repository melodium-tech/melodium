[package]
name = "crypto-mel"
version = "0.11.0"
authors = ["Quentin VIGNAUD <quentin.vignaud@melodium.tech>"]
rust-version = "1.83"
edition = "2021"
license = "EUPL-1.2"
homepage = "https://melodium.tech"
repository = "https://gitlab.com/melodium/melodium"
readme = "README.md"
description = "Mélodium cryptography library"
keywords = ["dataflow","parallelization","scalability","async","signal"]
categories = ["compilers", "science", "concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib"]
name = "crypto_mel"

[dependencies]
melodium-core = { path = "../../melodium-core", version = "0.11.0" }
melodium-macro = { path = "../../melodium-macro", version = "0.11.0" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize", "pem"] }
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
rsa = { version = "0.9", default-features = false, features = ["pem", "u64_digit"] }
serde_json = "1"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
mock = []
plugin = []
real = ["dep:rand_core"]
"docs.rs" = ["mock"]

[package.metadata.docs.rs]
features = ["docs.rs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "riscv64gc-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "wasm32-unknown-unknown"
]

