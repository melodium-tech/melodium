[package]
name = "ml-mel"
version = "0.11.0"
authors = ["Quentin VIGNAUD <quentin.vignaud@melodium.tech>"]
rust-version = "1.94"
edition = "2021"
license = "EUPL-1.2"
homepage = "https://melodium.tech"
repository = "https://gitlab.com/melodium/melodium"
readme = "README.md"
description = "Mélodium machine learning library"
keywords = ["dataflow","parallelization","scalability","async","signal"]
categories = ["compilers", "science", "concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib"]
name = "ml_mel"

[dependencies]
async-compat = { version = "0.2", optional = true }
blocking = { version = "1.6", optional = true }
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
flume = { version = "0.11" }
futures = { version = "0.3" }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq"] }
llm = { version = "1.3", optional = true, default-features = false, features = ["rustls-tls",
    # Providers features, allowing to use the corresponding provider with ml-mel
    "openai",
    "anthropic",
    "ollama",
    "deepseek",
    "xai",
    "phind",
    "google",
    "groq",
    "azure_openai",
    "elevenlabs",
    "agent",
    "cohere",
    "mistral",
    "openrouter",
    "huggingface",
    "bedrock"
]}
melodium-core = { path = "../../melodium-core", version = "0.11.0" }
melodium-macro = { path = "../../melodium-macro", version = "0.11.0" }

[features]
mock = []
plugin = []
real = [ "async-compat", "blocking", "hf-hub", "llm" ]
"docs.rs" = ["mock"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[package.metadata.docs.rs]
features = ["docs.rs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "riscv64gc-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "wasm32-unknown-unknown"
]


