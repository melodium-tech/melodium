[package]
name = "vault-mel"
version = "0.11.0"
authors = ["Quentin VIGNAUD <quentin.vignaud@melodium.tech>"]
rust-version = "1.83"
edition = "2021"
license = "EUPL-1.2"
homepage = "https://melodium.tech"
repository = "https://gitlab.com/melodium/melodium"
readme = "README.md"
description = "Mélodium vault library"
keywords = ["dataflow","parallelization","scalability","async","signal"]
categories = ["compilers", "science", "concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib"]
name = "vault_mel"

[dependencies]
async-std = "1.13"
async-trait = "0.1.71"
generic-async-http-client = { version = "0.7.0", features = ["use_async_h1", "rustls_ring"], optional = true }
melodium-core = { path = "../../melodium-core", version = "0.11.0" }
melodium-macro = { path = "../../melodium-macro", version = "0.11.0" }
percent-encoding = "2.3"
serde_json = "1.0"
zeroize = "1.9"

[features]
mock = []
plugin = []
real = ["generic-async-http-client"]
"docs.rs" = ["mock"]

[package.metadata.docs.rs]
features = ["docs.rs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "riscv64gc-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "wasm32-unknown-unknown"
]
