[package]
name = "http-mel"
version = "0.11.0"
authors = ["Quentin VIGNAUD <quentin.vignaud@melodium.tech>"]
rust-version = "1.94"
edition = "2021"
license = "EUPL-1.2"
homepage = "https://melodium.tech"
repository = "https://gitlab.com/melodium/melodium"
readme = "README.md"
description = "Mélodium HTTP library"
keywords = ["dataflow","parallelization","scalability","async","signal"]
categories = ["compilers", "science", "concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib"]
name = "http_mel"

[dependencies]
async-lock = "3.4"
futures = "0.3"
futures-lite = "2.6"
melodium-core = { path = "../../melodium-core", version = "0.11.0" }
melodium-macro = { path = "../../melodium-macro", version = "0.11.0" }
std-mel = { path = "../std-mel", version = "0.11.0" }
net-mel = { path = "../net-mel", version = "0.11.0" }
serde = "1.0.185"
trillium = { version = "0.2", features = ["serde"]}
trillium-router = { version = "0.4"}
trillium-smol = {version = "0.4.2", optional = true}
smol = {version = "2.0", optional = true}
trillium-client = {version = "0.6"}
trillium-rustls = { version = "0.8", default-features = false, features = ["client", "ring"], optional = true }
ringbuf = "0.3"
async-ringbuf = "0.1"
routefinder = "0.5"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }

[features]
mock = []
plugin = []
real = ["smol", "trillium-smol", "trillium-rustls"]
"docs.rs" = ["mock", "std-mel/docs.rs", "net-mel/docs.rs"]

[package.metadata.docs.rs]
features = ["docs.rs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "riscv64gc-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "wasm32-unknown-unknown"
]

