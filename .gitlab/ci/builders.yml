.builder:linux:x86_64-apple-darwin:
  extends:
    - .host:debian
    - .cache:cargo-osxcross
  before_script:
    - apt-get update
    - apt-get install -y clang gcc g++ cmake zlib1g-dev libmpc-dev libmpfr-dev libgmp-dev
    - rustup target add x86_64-apple-darwin
    - export PATH="$CARGO_HOME/bin:$PATH"
    - |
      if [ ! -d $CI_PROJECT_DIR/osxcross ]
      then
        base="$PWD"
        wget --no-clobber https://repo.melodium.tech/tooling/osxcross/osxcross-e6ab3fa.tar.gz
        tar --extract --gzip --file osxcross-e6ab3fa.tar.gz
        mv osxcross-master osxcross
        cd osxcross
        wget --no-clobber https://repo.melodium.tech/tooling/osxcross/MacOSX14.2.sdk.tar.xz
        mv MacOSX14.2.sdk.tar.xz tarballs/
        UNATTENDED=yes OSX_VERSION_MIN=14.2 ./build.sh
        ln -s "$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-strip" "$CI_PROJECT_DIR/osxcross/target/bin/strip"
        cd "$base"
      fi
    - export PATH="$CI_PROJECT_DIR/osxcross/target/bin:$PATH"
    - export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-clang
    - export CARGO_TARGET_X86_64_APPLE_DARWIN_AR=$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-ar
    - export CC_x86_64_apple_darwin=$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-cc
    - export AR_x86_64_apple_darwin=$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-ar
    - export CARGO_BUILD_TARGET=x86_64-apple-darwin
    - export CFLAGS_x86_64_apple_darwin=-fuse-ld=$CI_PROJECT_DIR/osxcross/target/bin/x86_64-apple-darwin23.2-ld
    - export SDKROOT="$CI_PROJECT_DIR/osxcross/target/SDK/MacOSX14.2.sdk"
    - export MACOSX_DEPLOYMENT_TARGET=14.2
    - rustc --version
    - cargo --version

